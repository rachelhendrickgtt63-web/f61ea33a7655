      - run:
          name: Build collector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gc_nursery -j2
      - run:
          name: Stress nursery collection
          command: LIONSS_LP=1 ./build/gc_nursery --conf gc.conf --allocs 5000000
  cosineWarmup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
